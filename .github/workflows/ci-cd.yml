name: CI/CD API DevOps

on:
  push:
    branches:
      - main

jobs:

  teste:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: |
          cd aplicacao
          npm install

      - name: Executar testes
        run: |
          cd aplicacao
          npm test


  docker:
    needs: teste
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build -t api-devops .
          # atualização do workflow
